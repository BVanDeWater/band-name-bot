<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Name Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-primary: #ec4899;
            --accent-secondary: #8b5cf6;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 640px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .info-value {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
        }

        .tweet-box {
            background-color: #0b0e14;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #d1d5db;
            white-space: pre-wrap;
            position: relative;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .btn {
            cursor: pointer;
            border: none;
            outline: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 10px;
            padding: 0.85rem 1.25rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #ffffff;
            flex: 1;
            box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
        }

        .btn-secondary {
            background-color: #21262d;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }

        .api-tip {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .api-tip code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            color: #f472b6;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            background: #238636;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎸 Band Name Bot</h1>
        <p>Your randomized rock &amp; indie band generator</p>
    </div>

    <div class="card">
        <div class="info-group">
            <span class="info-label">Band Name</span>
            <div class="info-value" id="bandName">{{ data.band_name }}</div>
        </div>

        <div class="info-group">
            <span class="info-label">Album Name</span>
            <div class="info-value" id="albumName">{{ data.album_name }}</div>
        </div>

        <div class="info-group">
            <span class="info-label">Promo Post / Tweet</span>
            <div class="tweet-box" id="tweetContent">{{ data.tweet }}</div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="generateBtn" onclick="generateNew()">
                <span>⚡ Generate New</span>
            </button>
            <button class="btn btn-secondary" onclick="copyTweet()" title="Copy to clipboard">
                📋 Copy
            </button>
        </div>
    </div>

    <div class="api-tip">
        JSON API available at <code>{{ url_for('.api_generate') }}</code>
    </div>
</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
    const API_ENDPOINT = {{ url_for('.api_generate')|tojson }};

    async function generateNew() {
        const btn = document.getElementById('generateBtn');
        btn.disabled = true;
        btn.style.opacity = '0.7';

        try {
            const res = await fetch(API_ENDPOINT);
            if (!res.ok) throw new Error('Network error');
            const data = await res.json();

            document.getElementById('bandName').textContent = data.band_name;
            document.getElementById('albumName').textContent = data.album_name;
            document.getElementById('tweetContent').textContent = data.tweet;
        } catch (err) {
            console.error('Failed to generate:', err);
        } finally {
            btn.disabled = false;
            btn.style.opacity = '1';
        }
    }

    function copyTweet() {
        const text = document.getElementById('tweetContent').textContent;
        navigator.clipboard.writeText(text).then(() => {
            showToast('Copied tweet to clipboard!');
        }).catch(() => {
            showToast('Failed to copy');
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>

</body>
</html>
